<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'">
    <title>Irodori 音声比較レビュー</title>
    <style>
      :root {
        color-scheme: light;
        --studio-ink: #18212b;
        --console-mist: #eaf2f5;
        --channel-white: #ffffff;
        --signal-teal: #176c78;
        --meter-amber: #c77a2b;
        --divider: #b8c7cd;
        --display-font: "Avenir Next", "Hiragino Sans", sans-serif;
        --body-font: "Hiragino Sans", "Yu Gothic", sans-serif;
        --utility-font: "SFMono-Regular", "Roboto Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--studio-ink);
        background: var(--console-mist);
        font-family: var(--body-font);
        line-height: 1.65;
      }

      button,
      input,
      audio {
        font: inherit;
      }

      button,
      label {
        -webkit-tap-highlight-color: transparent;
      }

      .review-shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 48px 0 56px;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 28px;
        align-items: end;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--divider);
      }

      .utility-label,
      #progress,
      #remaining {
        margin: 0;
        font-family: var(--utility-font);
        font-size: 0.73rem;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: var(--display-font);
        font-size: clamp(2rem, 5vw, 4.1rem);
        font-weight: 600;
        line-height: 1.03;
        letter-spacing: -0.045em;
      }

      .intro {
        max-width: 34rem;
        margin: 10px 0 0;
        color: #43525e;
        font-size: 0.95rem;
      }

      .status-cluster {
        min-width: 172px;
        padding: 14px 16px;
        border: 1px solid var(--divider);
        background: var(--channel-white);
      }

      #remaining {
        margin-top: 7px;
        color: var(--studio-ink);
        letter-spacing: 0.07em;
      }

      .script-panel {
        margin-top: 30px;
        padding: 22px 24px 24px;
        border: 1px solid var(--divider);
        background: var(--channel-white);
      }

      .script-panel .utility-label {
        color: var(--signal-teal);
      }

      #sample-text {
        max-width: 48rem;
        margin: 10px 0 0;
        font-size: clamp(1.05rem, 2vw, 1.28rem);
        font-weight: 500;
        line-height: 1.85;
        letter-spacing: 0.015em;
      }

      .listening-console {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 74px minmax(0, 1fr);
        gap: 0;
        align-items: stretch;
        margin-top: 18px;
      }

      .channel-card {
        display: flex;
        min-width: 0;
        min-height: 220px;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        border: 1px solid var(--divider);
        background: var(--channel-white);
      }

      .channel-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin: 0;
      }

      .channel-name {
        font-family: var(--display-font);
        font-size: clamp(2.8rem, 7vw, 5.2rem);
        font-weight: 600;
        line-height: 0.9;
        letter-spacing: -0.055em;
      }

      .channel-note {
        color: #53636f;
        font-family: var(--utility-font);
        font-size: 0.68rem;
        letter-spacing: 0.12em;
      }

      .channel-card audio {
        width: 100%;
        margin-top: 34px;
        accent-color: var(--signal-teal);
      }

      .center-rail {
        display: grid;
        place-items: center;
        border-top: 1px solid var(--divider);
        border-bottom: 1px solid var(--divider);
        background: var(--studio-ink);
      }

      .rail-label {
        color: var(--channel-white);
        font-family: var(--utility-font);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.17em;
        writing-mode: vertical-rl;
      }

      .judgment-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
        gap: 18px;
        margin-top: 18px;
      }

      fieldset {
        min-width: 0;
        margin: 0;
        padding: 22px 24px 24px;
        border: 1px solid var(--divider);
        background: var(--channel-white);
      }

      legend {
        padding: 0 10px 0 0;
        font-family: var(--display-font);
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .option-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .option-label {
        display: flex;
        min-height: 48px;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--divider);
        background: var(--channel-white);
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: border-color 140ms ease, background-color 140ms ease;
      }

      .option-label:hover {
        border-color: var(--signal-teal);
      }

      .option-label:has(input:checked) {
        border-color: var(--signal-teal);
        background: var(--console-mist);
        box-shadow: inset 4px 0 0 var(--signal-teal);
      }

      .option-label input {
        width: 1rem;
        height: 1rem;
        margin: 0;
        accent-color: var(--signal-teal);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        min-height: 50px;
        padding: 12px 18px;
        border: 1px solid var(--studio-ink);
        color: var(--studio-ink);
        background: var(--channel-white);
        cursor: pointer;
        font-weight: 700;
        transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease;
      }

      #previous {
        justify-self: start;
      }

      #next {
        justify-self: end;
      }

      #download {
        min-width: 190px;
        color: var(--channel-white);
        border-color: var(--signal-teal);
        background: var(--signal-teal);
      }

      button:hover:not(:disabled) {
        color: var(--channel-white);
        border-color: var(--studio-ink);
        background: var(--studio-ink);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      :focus-visible {
        outline: 3px solid var(--meter-amber);
        outline-offset: 3px;
      }

      @media (max-width: 760px) {
        .review-shell {
          width: min(100% - 24px, 640px);
          padding: 28px 0 36px;
        }

        .masthead,
        .judgment-grid {
          grid-template-columns: 1fr;
        }

        .status-cluster {
          min-width: 0;
        }

        .listening-console {
          grid-template-columns: 1fr;
        }

        .channel-card {
          min-height: 190px;
        }

        .center-rail {
          min-height: 44px;
          border-right: 1px solid var(--divider);
          border-left: 1px solid var(--divider);
        }

        .rail-label {
          writing-mode: horizontal-tb;
        }

        .actions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        #previous,
        #next {
          width: 100%;
          justify-self: stretch;
        }

        #download {
          grid-column: 1 / -1;
          grid-row: 2;
        }
      }

      @media (max-width: 440px) {
        .option-grid {
          grid-template-columns: 1fr;
        }

        .script-panel,
        .channel-card,
        fieldset {
          padding-right: 18px;
          padding-left: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="review-shell">
      <header class="masthead">
        <div>
          <h1>音声を聴き比べる</h1>
          <p class="intro">A と B を同じ基準で聴き、より良い音声を選んでください。理由は複数選べます。</p>
          <p class="intro">整合性確認は偶発的な破損や部分的な改変を検出します。同じユーザー権限でpacket全体を改変する攻撃は検出できません。強い真正性が必要な場合は外部sealを使用してください。</p>
        </div>
        <div class="status-cluster" aria-label="レビュー進捗">
          <p id="progress" aria-live="polite"></p>
          <p id="remaining" aria-live="polite"></p>
        </div>
      </header>

      <section class="script-panel" aria-labelledby="script-label">
        <p id="script-label" class="utility-label">読み上げ文</p>
        <p id="sample-text"></p>
      </section>

      <div class="listening-console" aria-label="音声比較">
        <section class="channel-card" aria-labelledby="channel-a-title">
          <h2 id="channel-a-title" class="channel-heading">
            <span class="channel-name">A</span>
            <span class="channel-note">音声</span>
          </h2>
          <audio id="audio-a" controls preload="metadata"></audio>
        </section>
        <div class="center-rail" aria-hidden="true">
          <span class="rail-label">LISTEN · COMPARE</span>
        </div>
        <section class="channel-card" aria-labelledby="channel-b-title">
          <h2 id="channel-b-title" class="channel-heading">
            <span class="channel-name">B</span>
            <span class="channel-note">音声</span>
          </h2>
          <audio id="audio-b" controls preload="metadata"></audio>
        </section>
      </div>

      <div class="judgment-grid">
        <fieldset id="choices">
          <legend>どちらが良いですか</legend>
          <div class="option-grid"></div>
        </fieldset>
        <fieldset id="reasons">
          <legend>理由（任意）</legend>
          <div class="option-grid"></div>
        </fieldset>
      </div>

      <nav class="actions" aria-label="レビュー操作">
        <button id="previous" type="button">前へ</button>
        <button id="download" type="button" disabled>結果を保存</button>
        <button id="next" type="button">次へ</button>
      </nav>
    </main>
    <script src="manifest.js"></script>
    <script src="review.js"></script>
  </body>
</html>
